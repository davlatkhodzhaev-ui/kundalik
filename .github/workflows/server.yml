name: Deploy server
on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/server.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Check settings
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then echo "ready=no" >> "$GITHUB_OUTPUT"; echo "Supabase is not connected yet, skipping."; else echo "ready=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ready == 'yes'
        with:
          version: latest
      - name: Create tables
        if: steps.cfg.outputs.ready == 'yes' && env.SUPABASE_DB_PASSWORD != ''
        run: supabase link --project-ref "$PROJECT_REF" && supabase db push
      - name: Deploy function
        if: steps.cfg.outputs.ready == 'yes'
        run: supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt
