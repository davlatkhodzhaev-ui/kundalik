name: Android build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK parts
        run: |
          SM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | $SM --licenses > /dev/null || true
          $SM "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build bundle (unsigned)
        env:
          VCODE: ${{ github.run_number }}
        run: gradle -p android bundleRelease --no-daemon --stacktrace && gradle -p android :app:dependencies --configuration releaseRuntimeClasspath | grep androidbrowserhelper | head -3
      - name: Put the bundle on the android-build branch
        run: |
          mkdir out
          cp android/app/build/outputs/bundle/release/app-release.aab out/kundalik-${{ github.run_number }}-unsigned.aab
          cd out
          git init -q
          git checkout -q -b android-build
          git add .
          git -c user.name="build bot" -c user.email="bot@users.noreply.github.com" commit -q -m "Unsigned bundle ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" android-build
