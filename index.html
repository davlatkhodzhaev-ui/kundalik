<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Электрон кундалик</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1130">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Кундалик">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: sticky header with pill tabs; each section opens with a midnight-navy banner with a gold glow,
     then soft-shadow cards. Palette: midnight navy + gold; state = colour + icon + word. Charts use gradients. */
  --bg:#f3f4f9; --surface:#ffffff; --ink:#0d1430; --muted:#626a85; --line:#e2e5ef; --track:#e8ebf4;
  --accent:#141d4d; --accent-ink:#ffffff; --accent-soft:#e7eaf7; --accent-deep:#0b1130;
  --good:#0b8457; --good-soft:#d8f3e7; --warn:#a86200; --warn-soft:#fbecc9; --crit:#c22a42; --crit-soft:#fbdfe4;
  --star:#d9a02a; --blue:#3348c8; --blue-soft:#e4e8fc; --gold:#b98a2c; --gold-soft:#f6ecd3;
  --cta:linear-gradient(135deg,#0b1130,#24337f); --cta-ink:#ffffff;
  --shadow:0 1px 2px rgba(13,20,48,.05),0 14px 34px -18px rgba(13,20,48,.22);
  --grad-good:linear-gradient(135deg,#0a7a50,#14a071); --grad-warn:linear-gradient(135deg,#a86200,#cf8a0c);
  --grad-crit:linear-gradient(135deg,#bf2940,#de465d); --grad-blue:linear-gradient(135deg,#2f43c0,#5868ef); --grad-gold:linear-gradient(135deg,#c79a3e,#ecd08a);
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#080c1b; --surface:#11172f; --ink:#eef0f8; --muted:#9aa2bd; --line:#232b4d; --track:#1e2545;
    --accent:#e2bf6c; --accent-ink:#1a1405; --accent-soft:#262a45; --accent-deep:#0b1130;
    --good:#45d6a0; --good-soft:#0f3327; --warn:#f2b84b; --warn-soft:#392c0e; --crit:#ff8292; --crit-soft:#431a23;
    --star:#f2c14a; --blue:#93a5ff; --blue-soft:#1c2554; --gold:#e2bf6c; --gold-soft:#332b16;
    --cta:linear-gradient(135deg,#f0d48c,#c79a3e); --cta-ink:#1a1405;
    --shadow:0 0 0 1px #232b4d,0 18px 40px -22px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#080c1b; --surface:#11172f; --ink:#eef0f8; --muted:#9aa2bd; --line:#232b4d; --track:#1e2545;
    --accent:#e2bf6c; --accent-ink:#1a1405; --accent-soft:#262a45; --accent-deep:#0b1130;
    --good:#45d6a0; --good-soft:#0f3327; --warn:#f2b84b; --warn-soft:#392c0e; --crit:#ff8292; --crit-soft:#431a23;
    --star:#f2c14a; --blue:#93a5ff; --blue-soft:#1c2554; --gold:#e2bf6c; --gold-soft:#332b16;
    --cta:linear-gradient(135deg,#f0d48c,#c79a3e); --cta-ink:#1a1405;
    --shadow:0 0 0 1px #232b4d,0 18px 40px -22px rgba(0,0,0,.8);
    color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
svg{display:block}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor;stroke:none}
.wrap{max-width:1060px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-top:10px;padding-bottom:10px}
.brand{font-family:var(--font-display);font-weight:700;font-size:15px;display:flex;align-items:center;gap:9px}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:inline-block;position:relative}
.brand i::after{content:"";position:absolute;left:7px;top:6px;width:11px;height:14px;border:2px solid var(--accent-ink);border-radius:2px;border-left-width:4px}
.mode{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:var(--r);margin-left:auto}
.tabs a{display:flex;align-items:center;gap:7px;padding:9px 16px;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:600;white-space:nowrap}
.tabs a svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs a.on{background:var(--accent);color:var(--accent-ink)}
main{padding:18px 0 60px}
.stack{display:flex;flex-direction:column;gap:16px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.note{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);border:1px solid var(--line);font-size:14px}
.note.crit{background:var(--crit-soft)}
.note b{font-weight:700}

/* banner that explains the section */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:20px;display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between}
.hero h1{font-family:var(--font-display);font-size:20px;font-weight:700;line-height:1.25}
.hero p{opacity:.9;margin-top:6px;font-size:15px;max-width:52ch}
.hero .side{display:flex;align-items:center;gap:14px}
.hero .ringbox{background:var(--surface);color:var(--ink);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px}
.hero .ringbox small{display:block;color:var(--muted);font-size:12px}
.hero .ringbox b{font-size:15px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.panel>h2{font-size:17px;font-weight:700;margin-bottom:14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.panel>h2 .ic{color:var(--accent);width:20px;height:20px}
.panel>h2 small{font-weight:400;color:var(--muted);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.grow{flex:1 1 220px}
.field label,.lab{font-size:13px;color:var(--muted);font-weight:600}
input[type=text],input[type=date],select{height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);min-width:0;width:100%}
.btn{height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{height:34px;padding:0 12px;font-size:14px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.datenav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.datenav input{width:160px}
.datenav .btn{padding:0 14px;font-size:18px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--bg);color:var(--muted)}
.chip .ic{width:14px;height:14px}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.acc{background:var(--blue-soft);color:var(--blue)}
.chip.star{background:var(--warn-soft);color:var(--warn)}

.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;flex:none}
.av.big{width:64px;height:64px;font-size:22px}
.av.sm{width:32px;height:32px;font-size:12px}

/* counters */
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.count{border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;background:var(--bg)}
.count .bub{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.count .bub .ic{width:22px;height:22px}
.count b{font-family:var(--font-display);font-size:20px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.count span{font-size:13px;color:var(--muted)}
.count.good .bub{background:var(--good-soft);color:var(--good)}
.count.warn .bub{background:var(--warn-soft);color:var(--warn)}
.count.crit .bub{background:var(--crit-soft);color:var(--crit)}
.count.acc .bub{background:var(--blue-soft);color:var(--blue)}

/* teacher student cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.scard{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;border-left:6px solid var(--line)}
.scard.s-y{border-left-color:var(--good)}
.scard.s-h{border-left-color:var(--warn)}
.scard.s-n,.scard.s-a{border-left-color:var(--crit)}
.scard .head{display:flex;align-items:center;gap:12px}
.scard .head b{font-size:16px;display:block}
.scard .head span{font-size:13px;color:var(--muted)}
.q{display:flex;flex-direction:column;gap:6px}
.opts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.opt{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px;padding:0 6px}
.opt .ic{width:16px;height:16px}
.opt.on{color:#fff;border-color:transparent}
.opt.g.on{background:var(--good)}
.opt.w.on{background:var(--warn)}
.opt.c.on{background:var(--crit)}
.opt.b.on{background:var(--blue)}
.opt.num{font-family:var(--font-display);font-size:16px}
.gradestar{display:flex;gap:14px;flex-wrap:wrap}
.gradestar .q{flex:1 1 150px}
.stars{display:flex;gap:4px}
.starbtn{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center;color:var(--line)}
.starbtn .ic{width:24px;height:24px}
.starbtn.on{color:var(--star);border-color:var(--star);background:var(--warn-soft)}

/* rings and stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;align-items:center;gap:14px}
.stat .k{font-size:13px;color:var(--muted);font-weight:600}
.stat .v{font-family:var(--font-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px}
.stat .s{font-size:13px;color:var(--muted)}
.ring text{font-family:var(--font-display);font-weight:700;font-size:17px;fill:var(--ink)}
.bigstar{width:84px;height:84px;border-radius:50%;background:var(--warn-soft);display:grid;place-items:center;color:var(--star);flex:none}
.bigstar .ic{width:44px;height:44px}

/* child header */
.child{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px}
.child .who{flex:1 1 220px;min-width:0}
.child .who b{font-family:var(--font-display);font-size:19px;display:block;line-height:1.25}
.child .who span{color:var(--muted);font-size:14px}
.lastday{border-radius:16px;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.lastday.good{background:var(--good-soft)}.lastday.warn{background:var(--warn-soft)}.lastday.crit{background:var(--crit-soft)}.lastday.none{background:var(--bg)}
.lastday .bub{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.lastday.good .bub{background:var(--good)}.lastday.warn .bub{background:var(--warn)}.lastday.crit .bub{background:var(--crit)}.lastday.none .bub{background:var(--muted)}
.lastday .bub .ic{width:28px;height:28px;stroke-width:2.6}
.lastday .txt{flex:1 1 220px}
.lastday .txt small{display:block;font-size:13px;color:var(--muted)}
.lastday .txt b{font-size:18px}

/* charts */
.chart{width:100%;height:auto}
.chart text{font-family:var(--font-body);font-size:14px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--accent);opacity:.13}
.chart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:3}
.chart .val{font-weight:700;fill:var(--ink);font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.cell{border-radius:10px;min-height:58px;padding:5px 7px;display:flex;flex-direction:column;justify-content:space-between;background:var(--bg);color:var(--muted)}
.cell .d{font-size:12px;font-variant-numeric:tabular-nums}
.cell .m{align-self:flex-end}
.cell .m .ic{width:22px;height:22px;stroke-width:2.8}
.cell.y{background:var(--good);color:#fff}
.cell.h{background:var(--warn);color:#fff}
.cell.n,.cell.a{background:var(--crit);color:#fff}
.cell.today{outline:3px solid var(--blue);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}

/* journal */
.entry{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.entry:first-of-type{border-top:0;padding-top:0}
.entry .dbox{width:54px;flex:none;border-radius:12px;text-align:center;padding:7px 0;color:#fff;align-self:flex-start}
.entry .dbox b{font-family:var(--font-display);font-size:18px;display:block;line-height:1.1}
.entry .dbox span{font-size:11px}
.entry .dbox.y{background:var(--good)}.entry .dbox.h{background:var(--warn)}.entry .dbox.n,.entry .dbox.a{background:var(--crit)}.entry .dbox.none{background:var(--muted)}
.entry .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.entry .body>b{font-weight:600}
.entry .say{background:var(--bg);border-radius:10px;padding:8px 12px;font-size:14px}
.entry .say small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.entry .f{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted)}

/* bars */
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.bar .nm{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600;font-size:14px}
.bar .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:14px;border-radius:8px;background:var(--track);overflow:hidden;grid-column:1/-1;order:3}
.bar .tr i{display:block;height:100%;border-radius:8px}
.bar .n{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;min-width:44px;text-align:right}
.gbar{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.gbar:first-child{border-top:0;padding-top:0}
.gbar>b{font-size:15px}
.gbar>small{color:var(--muted);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.people{display:flex;flex-direction:column}
.person{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:10px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:0;padding-top:0}
.person .nm{flex:1 1 180px;min-width:0}
.person .nm b{display:block}
.person .nm span{font-size:13px;color:var(--muted)}
.empty{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);z-index:9}
.toast[hidden]{display:none}
@media (max-width:760px){
  .two{grid-template-columns:1fr}
  .tabs{margin-left:0;width:100%}
  .tabs a{flex:1;justify-content:center;padding:9px 6px}
  .cards{grid-template-columns:1fr}
  .hero h1{font-size:18px}
}
@media (max-width:400px){.opt{font-size:12.5px;padding:0 3px}.opt .ic{display:none}}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.tabs a,.starbtn{transition:background-color .12s,color .12s,border-color .12s}}

/* ----- midnight + gold look ----- */
header.top{background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand i{background:linear-gradient(135deg,#0b1130,#24337f);border-radius:9px}
.brand i::after{border-color:#ecd08a}
.tabs{border-radius:999px;padding:5px;background:var(--track)}
.tabs a{border-radius:999px}
.tabs a.on{background:var(--cta);color:var(--cta-ink);box-shadow:0 8px 16px -8px rgba(11,17,48,.55)}
.btn{border-radius:12px}
.btn.primary{background:var(--cta);color:var(--cta-ink);border-color:transparent;box-shadow:0 8px 16px -10px rgba(11,17,48,.6)}
.panel,.stat{border:0;border-radius:24px;box-shadow:var(--shadow)}
.panel{padding:22px}
.panel>h2 .ic{color:var(--gold)}
.hero{position:relative;overflow:hidden;color:#fff;border-radius:28px;padding:28px;
  background:radial-gradient(560px 260px at 92% -20%,rgba(236,208,138,.42),transparent 62%),radial-gradient(440px 280px at -6% 130%,rgba(104,124,255,.42),transparent 62%),linear-gradient(135deg,#090e2a,#1b2870);
  box-shadow:0 22px 44px -22px rgba(9,14,42,.7)}
.hero h1{font-size:24px;letter-spacing:-.01em}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#f3dc9b,#c79a3e);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{opacity:.82}
.hero .ringbox{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hero .ringbox small{color:rgba(255,255,255,.75)}
.hero .ring text{fill:#fff}
.hero .ring circle:first-child{stroke:rgba(255,255,255,.2)}
.ring text{font-size:18px}
.count{border-radius:18px}
.count .bub{border-radius:14px}
.scard{border:0;border-left:6px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px}
.scard.s-y{border-left-color:var(--good)}.scard.s-h{border-left-color:var(--warn)}.scard.s-n,.scard.s-a{border-left-color:var(--crit)}
.opt{border-radius:12px;background:var(--track);border-color:transparent;color:var(--muted)}
.opt.on{box-shadow:0 8px 16px -10px rgba(13,20,48,.55)}
.opt.g.on{background:var(--grad-good)}.opt.w.on{background:var(--grad-warn)}.opt.c.on{background:var(--grad-crit)}.opt.b.on{background:var(--grad-blue)}
.starbtn{border-radius:12px;background:var(--track);border-color:transparent;color:color-mix(in srgb,var(--muted) 40%,transparent)}
.starbtn.on{background:var(--gold-soft);border-color:var(--star);color:var(--star)}
input[type=text],input[type=date],select{border-radius:12px;background:var(--surface)}
.av{box-shadow:0 6px 12px -6px rgba(13,20,48,.45)}
.bigstar{background:var(--gold-soft)}
.lastday{border-radius:20px}
.lastday.good .bub{background:var(--grad-good)}.lastday.warn .bub{background:var(--grad-warn)}.lastday.crit .bub{background:var(--grad-crit)}
.cell{border-radius:12px;background:var(--track)}
.cell.y{background:var(--grad-good)}.cell.h{background:var(--grad-warn)}.cell.n,.cell.a{background:var(--grad-crit)}
.cell.today{outline-color:var(--gold)}
.entry .dbox{border-radius:14px}
.entry .dbox.y{background:var(--grad-good)}.entry .dbox.h{background:var(--grad-warn)}.entry .dbox.n,.entry .dbox.a{background:var(--grad-crit)}
.entry .say{background:var(--track);border-radius:12px}

<script>
/*SAMPLE-START*/
function sampleData(todayIso){
  const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
  const rnd=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return ((h>>>0)%1000)/1000};
  const hash4=s=>{let h=7;for(let i=0;i<s.length;i++)h=(h*33+s.charCodeAt(i))>>>0;return String(1000+h%9000)};
  const T=['Собирхўжа устоз','Умархўжа устоз','Учинчи устоз'];
  const SUB={'Собирхўжа устоз':'Қуръон','Умархўжа устоз':'Араб тили','Учинчи устоз':'Учинчи дарс'};
  const groups={
    gb:{name:'Ётоқда қоладиганлар',kind:'b',teachers:T.slice(),subjects:SUB},
    gd:{name:'Келиб кетадиганлар',kind:'d',teachers:T.slice(),subjects:SUB}
  };
  const F=['Абдуллоҳ','Иброҳим','Умар','Ҳасан','Ҳусан','Муҳаммадали','Юсуф','Исмоил','Зайд','Билол','Анас','Ҳамза','Солиҳ','Яҳё','Закариё','Мусо','Ҳорун','Довуд','Сулаймон','Айюб','Идрис','Нуҳ','Илёс','Юнус','Шуайб','Луқмон','Убайдуллоҳ','Абдураҳмон','Абдулазиз','Муҳаммадюсуф'];
  const L=['Каримов','Раҳимов','Собиров','Эргашев','Тошматов','Юсупов','Нурматов','Алиев','Қодиров','Ҳакимов','Турсунов','Мирзаев','Исмоилов','Усмонов','Салимов','Ҳайдаров','Назаров','Орипов','Жўраев','Маматов','Сатторов','Холматов','Абдуллаев','Зокиров','Мамажонов','Ғаниев','Шарипов','Бобоев','Аҳмедов','Олимов'];
  const students={}, level={};
  for(let i=0;i<30;i++){const id='s'+(i+1); students[id]={name:F[i]+' '+L[i],gid:i<10?'gb':'gd',parent:L[i]+'лар оиласи'}; level[id]=0.6+rnd(id+'L')*0.37;}

function gradeChart(days){
  const pts=days.filter(d=>d.agg.n).slice(0,14).reverse();
  if(pts.length<2) return '<p class="empty">График чиқиши учун камида 2 кунлик маълумот керак.</p>';
  const W=640,H=210,L=50,R=22,T=26,B=30, x=i=>L+(W-L-R)*i/(pts.length-1), y=v=>T+(H-T-B)*(100-v)/100;
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Кунлик дарс топшириш графиги">';
  [100,50,0].forEach(g=>{s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(g)+'" y2="'+y(g)+'"/><text x="'+(L-8)+'" y="'+(y(g)+5)+'" text-anchor="end">'+g+'%</text>';});
  const V=pts.map(e=>Math.round(e.agg.y/e.agg.n*100)), P=V.map((v,i)=>[x(i),y(v)]); let dp='M'+P[0][0].toFixed(1)+','+P[0][1].toFixed(1);
  for(let i=0;i<P.length-1;i++){const mx=(P[i][0]+P[i+1][0])/2; dp+=' C'+mx.toFixed(1)+','+P[i][1].toFixed(1)+' '+mx.toFixed(1)+','+P[i+1][1].toFixed(1)+' '+P[i+1][0].toFixed(1)+','+P[i+1][1].toFixed(1);}
  s+='<path class="area" d="'+dp+' L'+(W-R)+','+(H-B)+' L'+L+','+(H-B)+' Z"/><path class="ln" d="'+dp+'"/>';
  const step=Math.ceil(pts.length/6);
  pts.forEach((e,i)=>{s+='<circle class="dot" cx="'+P[i][0].toFixed(1)+'" cy="'+P[i][1].toFixed(1)+'" r="5"/><text class="val" x="'+P[i][0].toFixed(1)+'" y="'+(P[i][1]-11).toFixed(1)+'" text-anchor="middle">'+V[i]+'</text>';
    if(i%step===0||i===pts.length-1){const dd=parse(e.date);s+='<text x="'+P[i][0].toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(i===0?'start':i===pts.length-1?'end':'middle')+'">'+dd.getDate()+'.'+String(dd.getMonth()+1).padStart(2,'0')+'</text>';}});
  return s+'</svg>';
}

  else if(act==='date'){if(t.value){ui.date=t.value;render(true);}}
  else if(act==='dayfield'){const f=t.dataset.f,v=t.value.trim();editDay(ui.gid,ui.date,curTeacher(),d=>{d[f]=v;});}
  else if(act==='note'){const sid=t.dataset.sid,v=t.value.trim();editDay(ui.gid,ui.date,curTeacher(),d=>{const r=Object.assign({},d.rows[sid]); if(v) r.n=v; else delete r.n; delete r.seen; d.rows[sid]=r;});}
});
function doLogout(){
  const fin=()=>{auth=null;setTok(null);pushOn=null;saveAuth();ui.out=false;ui.lrole=null;ui.lerr='';render(true);};
  if(net&&auth&&auth.role==='ota-ona'&&swOk){ Promise.race([(async()=>{const reg=await navigator.serviceWorker.getRegistration(), sub=reg&&await reg.pushManager.getSubscription(); if(sub){await call({a:'push.unsub',endpoint:sub.endpoint}); await sub.unsubscribe();}})(),new Promise(r=>setTimeout(r,3000))]).catch(()=>{}).then(fin); }
  else fin();
}
/* swipe left / right to move between sections */
let sw=null;
document.addEventListener('touchstart',e=>{ if(e.touches.length!==1||ui.out){sw=null;return;} const t=e.touches[0]; let n=e.target, blocked=false;
  while(n&&n!==document.body){ if(n.tagName==='INPUT'||n.tagName==='SELECT'||n.tagName==='TEXTAREA'||(n.scrollWidth>n.clientWidth+4&&/(auto|scroll)/.test(getComputedStyle(n).overflowX))){blocked=true;break;} n=n.parentNode; }
  const EDGE=36, w=window.innerWidth; if(t.clientX>EDGE&&t.clientX<w-EDGE) blocked=true;
  sw=blocked?null:{x:t.clientX,y:t.clientY,t:Date.now()}; },{passive:true});
document.addEventListener('touchend',e=>{ if(!sw) return; const t=e.changedTouches[0], dx=t.clientX-sw.x, dy=t.clientY-sw.y, dt=Date.now()-sw.t; sw=null;
  if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*2||dt>700) return;
  if(!auth){ if(dx>0&&ui.lrole){ui.lrole=null;ui.lerr='';render(true);} return; }
  const al=ROLES.filter(r=>ALLOW[auth.role].indexOf(r)>=0), i=al.indexOf(ui.role), j=i+(dx<0?1:-1);
  if(i<0||j<0||j>=al.length) return; location.hash=al[j]; window.scrollTo(0,0); },{passive:true});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(dirty) render();},0)});
function submitForm(e){
  const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  const fd=new FormData(f);
  if(document.activeElement) document.activeElement.blur();
  if(f.dataset.form==='login'||f.dataset.form==='addchild'){
    const code=String(fd.get('code')||'').trim();
    if(net){
      const add=f.dataset.form==='addchild';
      call(add?{a:'addchild',code:code}:{a:'login',role:ui.lrole,code:code}).then(r=>{
        if(!r||r.error){const m=r&&r.error==='wait'?'Кўп марта хато код киритилди. 15 дақиқадан кейин уриниб кўринг.':'Код нотўғри. Қайта текшириб ёзинг ёки кодни устоздан сўранг.'; if(add) toast(m); else ui.lerr=m; render(true); return;}
        setTok(r.token); auth={role:r.role,sids:r.sids||[]}; saveAuth(); ui.role=r.role; ui.lrole=null; ui.lerr='';
        if(add){ui.sid=(r.sids||[]).slice(-1)[0]; toast('Фарзанд қўшилди.');}
        skipKeep=true; render(true); skipKeep=false; refresh().then(()=>{if(r.role==='ota-ona') pushCheck();});
      }).catch(()=>{const m='Интернет йўқ. Қайта уриниб кўринг.'; if(add) toast(m); else ui.lerr=m; render(true);});
      return;
    }
    if(f.dataset.form==='addchild'){
      const sid=Object.keys(S.students).find(x=>codeOf(x)===code);
      if(!sid) toast('Бундай кодли ўқувчи топилмади. Кодни раҳбардан сўранг.');
      else{ if(auth.sids.indexOf(sid)<0) auth.sids.push(sid); ui.sid=sid; saveAuth(); toast(S.students[sid].name+' қўшилди.'); }
      render(true); return;
    }
    const r=ui.lrole; let ok=null;
    if(r==='rahbar'){ if(code===ADMIN_CODE) ok={role:r}; }
    else if(r==='hujra'){ if(code===ROOM_CODE) ok={role:r}; }
    else if(r==='ustoz'){ if(code===TEACHER_CODE) ok={role:r}; }
    else{ const sid=Object.keys(S.students).find(x=>codeOf(x)===code); if(sid) ok={role:r,sids:[sid]}; }
    if(ok){auth=ok;saveAuth();ui.role=r;ui.lrole=null;ui.lerr='';}
    else ui.lerr='Код нотўғри. Қайта текшириб ёзинг ёки кодни устоздан сўранг.';
    render(true); return;
  }
  if(f.dataset.form==='books'){const list=[];for(let i=0;i<NB;i++) list.push({name:String(fd.get('bn'+i)||'').trim(),lessons:Math.max(0,Number(fd.get('bl'+i))||0)}); if(!S.settings) S.settings={}; putDoc('settings','books',{list:list}); toast('Китоблар сақланди.'); return;}
  const name=String(fd.get('name')||'').trim(); if(!name) return;
  if(f.dataset.form==='student'){const nid=newId('s'), cd=String(fd.get('code')||'').trim();
    if(cd&&!/^\d{4}$/.test(cd)){toast('Код 4 та рақамдан иборат бўлиши керак.');return;}
    if(cd&&codeTaken(cd,nid)){toast('Бу код бошқа талабада бор. Бошқа код танланг.');return;}putDoc('students',nid,Object.assign({name:name,gid:String(fd.get('gid')),parent:String(fd.get('parent')||'').trim(),book:Math.max(1,Math.min(NB,Number(fd.get('book'))||1)),lesson:Math.max(1,Number(fd.get(Number(fd.get('book'))===QB?'sura':'lesson'))||1)},Number(fd.get('book2'))?{book2:Math.max(1,Math.min(NB,Number(fd.get('book2')))),lesson2:Math.max(1,Number(fd.get(Number(fd.get('book2'))===QB?'sura2':'lesson2'))||1)}:{},cd?{code:cd}:{},ui.newPhoto?{photo:ui.newPhoto}:{}));ui.newPhoto=null;if(!net) toast(name+' қўшилди. Ота-она коди: '+codeOf(nid));}
  else{const ts=[],sub={};String(fd.get('teachers')||'').split(',').forEach(x=>{const a=x.split(':'),n=(a[0]||'').trim(); if(!n) return; ts.push(n); const sb=(a[1]||'').trim(); if(sb) sub[n]=sb;});putDoc('groups',newId('g'),{name:name,kind:String(fd.get('kind')||''),teachers:ts,subjects:sub});toast('«'+name+'» гуруҳи қўшилди.');}
}
document.addEventListener('submit',e=>{skipKeep=true; try{submitForm(e);}finally{skipKeep=false;}});
function route(){const r=location.hash.replace('#','');ui.role=ROLES.indexOf(r)>=0?r:(auth?auth.role:'ustoz');ui.del=null;ui.reset=false;render(true);}
window.addEventListener('hashchange',route);

async function seed(){
  const d=sampleData(TODAY);
  if(!dbReal){S=d;toast('Намуна маълумотлар юкланди.');render(true);return;}
  if(busy) return; busy=true; render(true);
  try{
    for(const c of ['days','students','groups','settings']) for(const id of Object.keys(DBS[c])) await dbReal.doc(c+'/'+id).delete();
    for(const c of ['groups','students','days']) for(const id in d[c]) await dbReal.doc(c+'/'+id).set(d[c][id]);
    toast('Намуна маълумотлар базага ёзилди.');
  }catch(err){writeErr(err);}
  busy=false; render(true);
}

/* ---------- storage ---------- */
let dbReal=null; const DBS={groups:{},students:{},days:{},settings:{}};
function applyDb(){
  if(!(got.groups&&got.students&&got.days)){S=DBS;return;}
  // a store that was never set up for the madrasa layout (empty, or the first 9-student sample) shows the built-in sample instead
  const ready=Object.keys(DBS.groups).some(g=>DBS.groups[g].kind!==undefined);
  if(ready){S=DBS;mode='db';db=dbReal;}
  else if(mode!=='local'){S=sampleData(TODAY);mode='local';db=null;}
}
function connect(){
  mode='db'; loading=true; S=DBS; render(true);
  const timer=setTimeout(()=>{if(loading){slow=true;render();}},10000);
  ['groups','students','days','settings'].forEach(name=>{
    dbReal.collection(name).onSnapshot(snap=>{
      const o={}; snap.docs.forEach(d=>{o[d.id]=clone(d.data());});
      if(name==='days') Object.assign(o,pend);
      DBS[name]=o;
      if(!snap.metadata.fromCache){got[name]=true; if(got.groups&&got.students&&got.days){loading=false;slow=false;clearTimeout(timer);}}
      applyDb(); render();
    },()=>{clearTimeout(timer);loading=false;dbError=true;render();});
  });
}
function tick(){const t=iso(new Date()); if(t!==TODAY){ if(ui.date===TODAY) ui.date=t; TODAY=t; render(true); }}
setInterval(tick,60000); document.addEventListener('visibilitychange',()=>{if(!document.hidden) tick();});
route();
if('serviceWorker' in navigator&&/github\.io$/.test(location.hostname)){try{navigator.serviceWorker.register('sw.js').then(()=>{swOk=true;}).catch(()=>{});swOk=true;}catch(e){}}
if(!(window.claude&&typeof window.claude.use==='function')){
  /* Outside Claude the app always works with the real database: sample data is never shown here. */
  net=true; mode='db'; loading=true; S={groups:{},students:{},days:{},settings:{}};
  if(auth&&auth.role!=='hujra'&&!tok){auth=null;saveAuth();}
  render(true);
  refresh().then(()=>{if(auth&&auth.role==='ota-ona') pushCheck();});
  setInterval(()=>{if(!document.hidden) refresh();},20000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden) refresh();});
  window.addEventListener('online',()=>refresh());
}
if(window.claude&&typeof window.claude.use==='function'){
  window.claude.use('db').then(x=>{if(x){dbReal=x;db=x;connect();}}).catch(()=>{});
}
})();
</script>
